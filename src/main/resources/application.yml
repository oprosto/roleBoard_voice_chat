server:
  port: 8083
spring:
  application:
    name: auth-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/voice_chat_db
    username: postgres
    password: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  docker:
    compose:
      enabled: true

# ─── Logging ────────────────────────────────────
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.roleplace: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
