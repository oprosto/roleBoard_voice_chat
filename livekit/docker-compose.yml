version: '3.8'

services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    ports:
      - "7880:7880"      # WebSocket/HTTP API
      - "7881:7881"      # WebRTC over TCP
      - "7882:7882/udp"  # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command:
      - --config
      - /livekit.yaml
      - --node-ip
      - 26.4.171.72
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS}
      - CORS_ALLOW_ORIGIN=*
    networks:
      - livekit-network

  # Опционально: Redis для продвинутых функций (агенты, Egress и т.д.)
  # redis:
  #   image: redis:alpine
  #   container_name: livekit-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - livekit-network

networks:
  livekit-network:
    driver: bridge